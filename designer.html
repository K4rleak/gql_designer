<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designer - Types</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #333; }
        ul { list-style: none; padding: 0; }
        li { 
            background: #f4f4f4; 
            margin: 5px 0; 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            position: relative;
        }
        li:hover { background: #ddd; }
        .mutation-result {
            margin-top: 5px;
            padding: 5px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            font-size: 0.9em;
            display: none;
            white-space: pre-wrap;
        }
        .mutation-result button {
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Seznam Typů</h1>
    <ul id="types-list">
        <li>Načítání...</li>
    </ul>

    <script>
        // Funkce pro načtení typů z endpointu /designer
        async function loadTypes() {
            try {
                const response = await fetch('/designer', {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();
                const typesList = document.getElementById('types-list');
                typesList.innerHTML = ''; // Vymazání placeholderu

                if (data.types.length > 0) {
                    data.types.forEach(type => {
                        const li = document.createElement('li');
                        li.textContent = `${type.name} (ID: ${type.id})`;

                        const resultDiv = document.createElement('div');
                        resultDiv.className = 'mutation-result';
                        li.appendChild(resultDiv);

                        li.onclick = () => {
                            sendGraphQLMutation(type.id, resultDiv, li);
                            li.onclick = null;
                            li.style.cursor = "default";
                        };
                        typesList.appendChild(li);
                    });
                } else {
                    typesList.innerHTML = '<li>Žádné typy nebyly nalezeny.</li>';
                }
            } catch (error) {
                console.error('Chyba při načítání typů:', error);
                document.getElementById('types-list').innerHTML = '<li>Chyba při načítání dat.</li>';
            }
        }


        async function create_db_model(typeId, resultDiv, li) {
            return "Salamek"
        }
        // Funkce pro odeslání GraphQL mutace
        async function sendGraphQLMutation(typeId, resultDiv, li) {
            const gqlMutation = {
                query: `
                    mutation GenCode {
                        generatePythonCode(type_: {id: "${typeId}"})
                    }
                `
            };

            try {
                const response = await fetch('/gql', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(gqlMutation)
                });

                const result = await response.json();
                console.log('Výsledek mutace:', result);
                const code = result?.data?.generatePythonCode || '# Chyba: Kód nebyl v odpovědi nalezen.';

                const formattedResult = JSON.stringify(result, null, 2)
                    .replace(/\\n/g, '<br>')
                    .replace(/\\"/g, '"');

                resultDiv.innerHTML = `Výsledek:<br><pre>${formattedResult}</pre>`;

                // Přidání tlačítka "Download" (zatím bez funkce)
                const downloadButton = document.createElement('button');
                downloadButton.textContent = 'Download';
                downloadButton.onclick = async () => {
                alert(await create_db_model());
                const blob = new Blob([code], { type: 'text/x-python' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = `generated_code_${typeId}.py`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };



                resultDiv.appendChild(downloadButton);

                resultDiv.style.display = 'block';

            } catch (error) {
                console.error('Chyba při volání GraphQL mutace:', error);
                resultDiv.innerHTML = '<span style="color:red;">Chyba při volání mutace</span>';
                resultDiv.style.display = 'block';
                resultDiv.style.background = '#ffebee';
                resultDiv.style.borderLeft = '4px solid #f44336';
            }
        }

        window.onload = loadTypes;
    </script>
</body>
</html>
